[pytest]
testpaths = tests
addopts = -q -m "not network"
filterwarnings =
    ignore::DeprecationWarning
markers =
    network: ходит в реальную сеть (data.binance.vision). Не входит в общий
        прогон (addopts исключает по умолчанию) — запускать явно
        `pytest -m network`, обязательно перед каждым изменением карты
        конвенций create_time (docs/tz_deriv_ingest_14-08-26.md, §0.8, A3).
