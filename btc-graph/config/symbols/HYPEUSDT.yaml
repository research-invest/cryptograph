    - [0.3333, 1.0]
    - [0.2857, 0.7]
    - [0.2, 0.4]
    floor: 0.1
  fa_ratio:
    mode: higher_better
    ladder:
    - [2.546, 1.0]
    - [2.45, 0.4]
    floor: 0.1
rarity:
