# Калибровка HYPEUSDT, версия 3. Основа — черновик scripts/calibrate_profile.py
# по всем 445 кандидатам выгрузки hype_candidates_v3 (модель прогона #34,
# история с листинга на Bybit 2025-07-11, 37 021 бар 15m, граница 2026-08-01).
#
# Окно калибровки здесь — ВСЯ выгрузка (--tail 0), а не свежая четверть, как
# у длинных монет. Причина арифметическая: четверть от 445 — это 111
# кандидатов, на которых перцентиль меряет собственный шум.
#
# ─── Почему профиль перекалиброван (2026-08-13) ────────────────────────────
# У short появился собственный F/A ratio, и ось directional перестала
# считаться ему по двум критериям вместо трёх. Разбор и замер — раздел 8
# журнала; шапка BTCUSDT.yaml описывает причину подробнее.
#
# ─── Что получилось ────────────────────────────────────────────────────────
# 1.1% STRONG, 38.2% MODERATE, медиана 0.4708. Веса — прежний пресет young.
#
# Все кандидаты по-прежнему приходят со `sample_scope=transition` — блочного
# уточнения у монеты не бывает вовсе (раздел 27.5 журнала генератора).
# Значит ось rarity у неё ВСЕГДА считается по двум критериям; вес 0.10 из
# пресета young это отчасти и компенсирует.
#
# Проверка на отложенной трети: 0% STRONG и 70.1% MODERATE против 1.3% и
# 37.9% на калибровочной. Дрейф самый сильный из всех монет — на 134
# кандидатах иначе и не бывает. Профиль этой монеты стоит пересобрать,
# как только у неё накопится вдвое больше истории.
#
# Меняешь пороги — бампай version (правило 6 из docs/step_04_multi_symbol.md)
# и обнови sanity-якорь в tests/fixtures/sanity_candidates.json.

