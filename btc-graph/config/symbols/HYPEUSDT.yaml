    ladder:
    - [0.2177, 1.0]
    - [0.2482, 0.7]
    - [0.2872, 0.3]
    floor: 0.0
  repeatability_months:
    mode: higher_better
    ladder:
    - [11, 1.0]
    - [9, 0.7]
    - [8, 0.4]
    floor: 0.1
directional:
  win_rate:
    mode: higher_better
    ladder:
    - [0.6667, 1.0]
    - [0.6429, 0.7]
    - [0.6, 0.4]
    floor: 0.1
  abs_outcome_skew:
    mode: higher_better
