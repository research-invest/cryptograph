# ЧЕРНОВИК, сгенерированный scripts/calibrate_profile.py.
# Ступени — перцентили выборки монеты; они не знают, что маленькая
# выборка статистически несостоятельна даже если это p90 монеты.
# Перед вводом в работу: проверь топ-10 глазами, положи sanity-кандидата
# в tests/fixtures/ и зафиксируй его ожидаемый рейтинг.
# Меняешь профиль потом — бампай version (правило 6).

symbol: HYPEUSDT
version: 1
description: Черновик калибровки по 446 кандидатам (scripts/calibrate_profile.py,
  пресет весов «young»)
extends: _default
weights: {statistical: 0.4, directional: 0.25, context: 0.25, rarity: 0.1}
statistical:
  sample_size:
    mode: higher_better
    ladder:
    - [166, 1.0]
    - [123, 0.7]
    - [59, 0.4]
