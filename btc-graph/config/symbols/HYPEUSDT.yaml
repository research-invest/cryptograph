# Калибровка HYPEUSDT, версия 2. Основа — черновик scripts/calibrate_profile.py
# по всем 445 кандидатам новой выгрузки (модель прогона #34, история с
# листинга на Bybit 2025-07-11, 37 021 бар 15m, граница 2026-08-01).
#
# Окно калибровки здесь — ВСЯ выгрузка (--tail 0), а не свежая четверть, как
# у длинных монет. Причина арифметическая: четверть от 445 — это 111
# кандидатов, на которых перцентиль меряет собственный шум. Оговорка про рост
# sample_size по истории для монеты с годом торгов работает слабее.
#
# ─── Почему профиль перекалиброван (2026-08-13) ────────────────────────────
# Правки блока A внешнего аудита изменили и выдачу генератора, и вход оси
# rarity (btc-graph/docs/development_log.md, раздел 5; генератор — раздел 29):
#
#   * порог выборки применяется к РЕАЛИЗАЦИЯМ перехода, а не к строкам
#     снимков, — часть кандидатов перестала выпускаться;
#   * `research_score` считает объём выборки по реализациям и просел;
#   * за редкость блока событий баллы больше не начисляются, когда выборка
#     на блок не обусловлена, — а это большинство выдачи.
#
# Второе основание, независимое от аудита: действующая калибровка снята с
# модели состояний, которую в бою уже заменили переобучением 2026-08-11.
# Профиль обязан описывать ту модель, что работает сейчас.
#
# ─── Новое: ступень по реализациям ─────────────────────────────────────────
# `effective_sample_size` — число независимых реализаций перехода. Она НЕ
# заменяет `sample_size`, а стоит рядом: кандидат, выпущенный до 2026-08-13,
# поля не несёт и считается прежней ступенью, на которой и был выпущен.
# Отношение строк к реализациям — 1.5…2.8, и оно не константа: оно зависит от
# того, как долго держалось состояние. Ранжируя по `sample_size`, ось частично
# ранжировала по живучести состояния, а не по объёму свидетельств.
#
# ─── Что получилось ────────────────────────────────────────────────────────
# 1.3% STRONG, 37.8% MODERATE, медиана 0.4708 — селективность эталона.
# Веса — прежний пресет young.
#
# Главное число этой монеты: новый порог выборки отсёк 74.9% кандидатов
# (1771 → 445). Это не поломка, а то, ради чего порог и вводился: при годе
# истории 30 строк снимков означали около одиннадцати реализаций перехода.
# Профиль калиброван по тому, что осталось.
#
# Все кандидаты по-прежнему приходят со `sample_scope=transition` — блочного
# уточнения у монеты не бывает вовсе (раздел 27.5 журнала генератора).
# Значит ось rarity у неё ВСЕГДА считается по двум критериям; вес 0.10 из
# пресета young это отчасти и компенсирует.
#
# Лесенка fa_ratio вышла двухступенчатой: p75 и p90 разошлись всего на 0.096,
# и средняя ступень схлопнулась при дедупликации. Это честное «признак почти
# не различает» на 72 long-кандидатах, а не недосмотр.
#
# Проверка на отложенной трети: 0% STRONG и 67.9% MODERATE против 1.3% и
# 37.8% на калибровочной. Дрейф самый сильный из всех монет — на 134
# кандидатах иначе и не бывает. Профиль этой монеты стоит пересобрать,
# как только у неё накопится вдвое больше истории.
#
# Меняешь пороги — бампай version (правило 6 из docs/step_04_multi_symbol.md)
# и обнови sanity-якорь в tests/fixtures/sanity_candidates.json.

symbol: HYPEUSDT
version: 2
description: Калибровка по 445 кандидатам выгрузки модели #34, веса young
extends: _default
