# Калибровка ETHUSDT, версия 2. Основа — черновик scripts/calibrate_profile.py
# по 8713 свежим кандидатам новой выгрузки (модель прогона #25, полная история
# 313 439 баров 15m, граница 2026-08-01).
#
# ─── Почему профиль перекалиброван (2026-08-13) ────────────────────────────
# Правки блока A внешнего аудита изменили и выдачу генератора, и вход оси
# rarity (btc-graph/docs/development_log.md, раздел 5; генератор — раздел 29):
#
#   * порог выборки применяется к РЕАЛИЗАЦИЯМ перехода, а не к строкам
#     снимков, — часть кандидатов перестала выпускаться;
#   * `research_score` считает объём выборки по реализациям и просел;
#   * за редкость блока событий баллы больше не начисляются, когда выборка
#     на блок не обусловлена, — а это большинство выдачи.
#
# Второе основание, независимое от аудита: действующая калибровка снята с
# модели состояний, которую в бою уже заменили переобучением 2026-08-11.
# Профиль обязан описывать ту модель, что работает сейчас.
#
# ─── Новое: ступень по реализациям ─────────────────────────────────────────
# `effective_sample_size` — число независимых реализаций перехода. Она НЕ
# заменяет `sample_size`, а стоит рядом: кандидат, выпущенный до 2026-08-13,
# поля не несёт и считается прежней ступенью, на которой и был выпущен.
# Отношение строк к реализациям — 1.5…2.8, и оно не константа: оно зависит от
# того, как долго держалось состояние. Ранжируя по `sample_size`, ось частично
# ранжировала по живучести состояния, а не по объёму свидетельств.
#
# ─── Что получилось ────────────────────────────────────────────────────────
# 0.9% STRONG, 38.1% MODERATE, медиана 0.4546 — селективность эталона.
# Разброс осей: statistical σ 0.226, directional σ 0.264, context σ 0.256,
# rarity σ 0.120.
#
# Наблюдение версии 1 («для ETH линейка BTC была слишком МЯГКОЙ») в силе:
# ступени sample_size у ETH по-прежнему выше, чем у BTC (1310/699/292 против
# 1010/585/242), потому что граф состояний грубее и на конфигурацию приходится
# больше случаев. Проверять фактом, а не ожиданием от альткоина.
#
# valid_label_pct намеренно НЕ переопределён и наследуется: p90 равен 1.0,
# ступень с таким порогом недостижима (сравнение строгое).
#
# Проверка на отложенной свежей трети: 1.7% STRONG против 0.9% на
# калибровочной, MODERATE 38.7% против 38.1% — дрейф в допуске.
#
# Меняешь пороги — бампай version (правило 6 из docs/step_04_multi_symbol.md)
# и обнови sanity-якорь в tests/fixtures/sanity_candidates.json.

symbol: ETHUSDT
version: 2
description: Калибровка по 8713 свежим кандидатам выгрузки модели #25, веса major-alt
extends: _default
weights: {statistical: 0.35, directional: 0.3, context: 0.2, rarity: 0.15}
statistical:
  sample_size:
    mode: higher_better
    ladder:
    - [1310, 1.0]
    - [699, 0.7]
    - [292, 0.4]
    floor: 0.1
  effective_sample_size:
    mode: higher_better
    ladder:
    - [595, 1.0]
    - [293, 0.7]
    - [144, 0.4]
    floor: 0.1
  monthly_concentration:
    mode: lower_better
    ladder:
    - [0.0332, 1.0]
    - [0.0427, 0.7]
    - [0.058, 0.3]
    floor: 0.0
  repeatability_months:
    mode: higher_better
    ladder:
    - [89, 1.0]
    - [75, 0.7]
    - [56, 0.4]
    floor: 0.1
directional:
  win_rate:
    mode: higher_better
    ladder:
    - [0.6242, 1.0]
    - [0.5842, 0.7]
    - [0.5604, 0.4]
    floor: 0.1
  abs_outcome_skew:
    mode: higher_better
    ladder:
    - [0.2485, 1.0]
    - [0.1683, 0.7]
    - [0.1208, 0.4]
    floor: 0.1
  fa_ratio:
    mode: higher_better
    ladder:
    - [3.383, 1.0]
    - [2.777, 0.7]
    - [2.296, 0.4]
    floor: 0.1
rarity:
  research_score:
    mode: higher_better
    ladder:
    - [0.7305, 1.0]
    - [0.7084, 0.7]
    - [0.6765, 0.4]
    floor: 0.2
rating: {strong_min: 0.714, moderate_min: 0.489}
batch: {min_quality_score: 0.489, fresh_bonus: 0.05}
