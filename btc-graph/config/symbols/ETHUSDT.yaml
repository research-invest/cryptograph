# Калибровка ETHUSDT. Основа — черновик scripts/calibrate_profile.py по
# 9628 свежим кандидатам прогона #14 (полная история, 314 164 бара 15m).
#
# Что здесь важно понимать. У ETH история такой же длины, как у BTC, но граф
# состояний грубее (29 узлов против 43), поэтому на одну конфигурацию
# приходится БОЛЬШЕ исторических случаев. По базовой калибровке ось
# statistical у ETH насыщалась: среднее 0.827 при разбросе 0.121 — почти все
# кандидаты упирались в потолок, и ось переставала различать. Поднятые
# ступени sample_size (1497/717/242 против 1000/500/200) возвращают ей
# разрешающую способность: среднее 0.495, разброс 0.222.
#
# То есть для ETH линейка BTC была не слишком строгой, а слишком мягкой —
# обратное тому, чего ждёшь от альткоина. Проверять фактом, а не ожиданием.
#
# valid_label_pct намеренно НЕ переопределён и наследуется: у ETH p90 этого
# признака равен 1.0, то есть у девяти кандидатов из десяти метки валидны все
# до одной. Ступень с порогом 1.0 недостижима (сравнение строгое), а признак
# на верхушке выборки всё равно ничего не различает.
#
# Границы рейтинга подобраны под селективность эталона: BTCUSDT по базовому
# профилю даёт 1.0% STRONG / 37.6% MODERATE, здесь выходит 1.0% / 38.3%.
# Одинаковая селективность нужна, чтобы сводный список «что сегодня сильного»
# не заливался монетой с самой низкой планкой.
#
# Проверка на отложенной свежей трети: 1.9% STRONG — лёгкий дрейф вверх,
# он структурный (sample_size растёт со временем), в допуске.
#
# Меняешь пороги — бампай version (правило 6 из docs/step_04_multi_symbol.md).

symbol: ETHUSDT
version: 1
description: Калибровка по 9628 свежим кандидатам прогона #14, веса major-alt
extends: _default
weights: {statistical: 0.35, directional: 0.3, context: 0.2, rarity: 0.15}
statistical:
  sample_size:
    mode: higher_better
    ladder:
    - [1497, 1.0]
    - [717, 0.7]
    - [242, 0.4]
    floor: 0.1
  monthly_concentration:
    mode: lower_better
    ladder:
    - [0.0291, 1.0]
    - [0.0404, 0.7]
    - [0.0604, 0.3]
    floor: 0.0
  repeatability_months:
    mode: higher_better
    ladder:
    - [88, 1.0]
    - [78, 0.7]
    - [54, 0.4]
    floor: 0.1
directional:
  win_rate:
    mode: higher_better
    ladder:
    - [0.6303, 1.0]
    - [0.5901, 0.7]
    - [0.5619, 0.4]
    floor: 0.1
  abs_outcome_skew:
    mode: higher_better
    ladder:
    - [0.2605, 1.0]
    - [0.1802, 0.7]
    - [0.1239, 0.4]
    floor: 0.1
  fa_ratio:
    mode: higher_better
    ladder:
    - [3.051, 1.0]
    - [2.538, 0.7]
    - [2.162, 0.4]
    floor: 0.1
rarity:
  research_score:
    mode: higher_better
    ladder:
    - [0.7676, 1.0]
    - [0.7422, 0.7]
    - [0.7131, 0.4]
    floor: 0.2
rating: {strong_min: 0.717, moderate_min: 0.507}
batch: {min_quality_score: 0.507, fresh_bonus: 0.05}
