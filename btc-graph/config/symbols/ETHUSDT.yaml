# Калибровка ETHUSDT, версия 3. Основа — черновик scripts/calibrate_profile.py
# по 8713 свежим кандидатам выгрузки eth_candidates_v3 (модель прогона #25,
# полная история 313 439 баров 15m, граница 2026-08-01).
#
# ─── Почему профиль перекалиброван (2026-08-13) ────────────────────────────
# У short появился собственный F/A ratio, и ось directional перестала
# считаться ему по двум критериям вместо трёх. Разбор и замер — раздел 8
# журнала; шапка BTCUSDT.yaml описывает причину подробнее.
#
# ─── Что получилось ────────────────────────────────────────────────────────
# 0.8% STRONG, 39.5% MODERATE, медиана 0.4517. Веса прежние (major-alt).
#
# Наблюдение версии 1 в силе: ступени sample_size у ETH по-прежнему выше,
# чем у BTC, потому что граф состояний грубее и на конфигурацию приходится
# больше случаев. Проверять фактом, а не ожиданием от альткоина.
#
# valid_label_pct намеренно НЕ переопределён и наследуется: p90 равен 1.0,
# ступень с таким порогом недостижима (сравнение строгое).
#
# Проверка на отложенной свежей трети: 1.5% STRONG против 0.8% на
# калибровочной, MODERATE 40.9% против 39.3% — дрейф в допуске.
#
# Меняешь пороги — бампай version (правило 6 из docs/step_04_multi_symbol.md)
# и обнови sanity-якорь в tests/fixtures/sanity_candidates.json.

