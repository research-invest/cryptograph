# Калибровка SOLUSDT, версия 3. Основа — черновик scripts/calibrate_profile.py
# по 4762 свежим кандидатам выгрузки sol_candidates_v3 (модель прогона #26,
# история с листинга 2020-08, 209 260 баров 15m, граница 2026-08-01).
#
# ─── Почему профиль перекалиброван (2026-08-13) ────────────────────────────
# У short появился собственный F/A ratio, и ось directional перестала
# считаться ему по двум критериям вместо трёх. Разбор и замер — раздел 8
# журнала; шапка BTCUSDT.yaml описывает причину подробнее.
#
# ─── Что получилось ────────────────────────────────────────────────────────
# 1.0% STRONG, 37.8% MODERATE, медиана 0.4617. Веса — прежний пресет
# low-liquidity (statistical 0.40): у SOL directional шумит сильнее, чем у
# старших монет, перекос на короткой выборке чаще артефакт, чем сигнал.
#
# valid_label_pct не переопределён по той же причине, что и у ETH.
#
# Проверка на отложенной свежей трети: 2.9% STRONG против 1.1% на
# калибровочной — дрейф заметнее, чем у ETH, и это ожидаемо: история короче,
# накопление выборки идёт круче. Порог терпимости прежний: выше 5% STRONG —
# пересобирать профиль и бампать version.
#
# Меняешь пороги — бампай version (правило 6 из docs/step_04_multi_symbol.md)
# и обнови sanity-якорь в tests/fixtures/sanity_candidates.json.

