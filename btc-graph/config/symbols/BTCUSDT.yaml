# Калибровка BTCUSDT, версия 4. Основа — черновик scripts/calibrate_profile.py
# по 7980 свежим кандидатам выгрузки btc_candidates_v3 (модель прогона #24,
# полная история 313 439 баров 15m, граница 2026-08-01).
#
# ─── Почему профиль перекалиброван (2026-08-13) ────────────────────────────
# У short-кандидатов появился собственный F/A ratio
# (`short_favorable_adverse_ratio_p70_p80`, см. раздел 8 журнала). До этого
# ось directional считалась им по ДВУМ критериям вместо трёх, и медианный
# short получал по ней 0.100 против 0.400 у long — штраф за сторону рынка,
# а не за качество конфигурации.
#
# Перекалибровка нужна не «на всякий случай», а потому что распределение
# оси изменилось с обеих сторон сразу: у части short третий критерий поднял
# балл, у верхушки — опустил (среднее трёх ниже среднего двух, когда новый
# критерий посредственный). Действующий профиль @3 на новой выгрузке давал
# 0.3% STRONG при цели 1%.
#
# ─── Что получилось ────────────────────────────────────────────────────────
# 1.0% STRONG, 38.2% MODERATE, медиана 0.4475. Все четыре оси с живым
# разбросом (σ 0.12…0.25, ни одна не вырождена), веса прежние — правило 1
# («сначала ступени, потом веса») сработало полностью.
#
# Ступени win_rate и abs_outcome_skew ОБЩИЕ на обе стороны. Отдельные
# ступени на сторону были реализованы и отвергнуты замером: после появления
# short-версии F/A ratio они не меняют ни медиану оси, ни её разброс, а на
# ETHUSDT ухудшали баланс. Разбор — раздел 8.3 журнала.
#
# Проверка на отложенной свежей трети: 0.3% STRONG (на калибровочной 1.1%),
# MODERATE 46.4% против 38.1%. Дрейф в ту же сторону и по той же причине,
# что и раньше (sample_size растёт со временем). Порог пересборки прежний:
# выше 5% STRONG — собирать профиль заново, а не терпеть.
#
# Меняешь пороги — бампай version (правило 6 из docs/step_04_multi_symbol.md)
# и обнови sanity-якорь в tests/fixtures/sanity_candidates.json.

symbol: BTCUSDT
version: 4
description: 'Калибровка по 7980 свежим кандидатам выгрузки v3 модели #24, веса btc'
extends: _default
weights: {statistical: 0.3, directional: 0.35, context: 0.2, rarity: 0.15}
statistical:
  sample_size:
    mode: higher_better
    ladder:
    - [1010, 1.0]
    - [585, 0.7]
    - [242, 0.4]
    floor: 0.1
  effective_sample_size:
    mode: higher_better
    ladder:
    - [416, 1.0]
    - [248, 0.7]
    - [127, 0.4]
    floor: 0.1
  monthly_concentration:
    mode: lower_better
    ladder:
    - [0.0416, 1.0]
    - [0.0498, 0.7]
    - [0.0611, 0.3]
    floor: 0.0
  repeatability_months:
    mode: higher_better
    ladder:
    - [78, 1.0]
    - [70, 0.7]
    - [55, 0.4]
    floor: 0.1
directional:
  win_rate:
    mode: higher_better
    ladder:
    - [0.6316, 1.0]
    - [0.5965, 0.7]
    - [0.5684, 0.4]
    floor: 0.1
  abs_outcome_skew:
    mode: higher_better
    ladder:
    - [0.2632, 1.0]
    - [0.193, 0.7]
    - [0.1368, 0.4]
    floor: 0.1
  fa_ratio:
    mode: higher_better
    ladder:
    - [3.241, 1.0]
    - [2.727, 0.7]
    - [2.221, 0.4]
    floor: 0.1
rarity:
  research_score:
    mode: higher_better
    ladder:
    - [0.7303, 1.0]
    - [0.7055, 0.7]
    - [0.6794, 0.4]
    floor: 0.2
rating: {strong_min: 0.697, moderate_min: 0.482}
batch: {min_quality_score: 0.482, fresh_bonus: 0.05}
