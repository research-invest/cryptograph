# Калибровка BTCUSDT, версия 2. Основа — черновик scripts/calibrate_profile.py
# по 9810 свежим кандидатам прогона #17 (полная история, 314 177 баров 15m,
# 43 состояния).
#
# ЧТО ИЗМЕНИЛОСЬ ПРОТИВ ВЕРСИИ 1. Раньше здесь было пустое наследование:
# `_default` и был калибровкой под биткоин. На реальной выгрузке выяснилось,
# что сегодня она для него слишком МЯГКАЯ — ось statistical насыщалась,
# среднее 0.822 при разбросе 0.143, почти все кандидаты у потолка, и ось
# перестала различать. Причина в накоплении: ступень sample_size > 1000
# ставилась под эталонный кандидат ТЗ с выборкой 1339, а за девять лет
# истории типичная выборка выросла кратно.
#
# Поднятые ступени (2342/904/201 против 1000/500/200) вернули оси
# разрешающую способность: среднее 0.496, разброс 0.224. Распределение
# рейтингов при этом почти не поехало — 0.8% STRONG было, 1.0% стало.
#
# ВАЖНОЕ СЛЕДСТВИЕ. `_default` больше не равен профилю биткоина. Он стал тем,
# чем и должен быть: неподвижной общей меркой, по которой считается
# quality_score_baseline у ВСЕХ монет. Его правка обесценивает межмонетное
# сравнение и сравнение во времени, поэтому он заморожен снапшот-тестом.
#
# Эталонный кандидат из ТЗ по этому профилю получает MODERATE вместо STRONG:
# его выборка (1339) и сезонная концентрация (0.0999) не похожи на то, что
# генератор выпускает сегодня — p50 концентрации на свежих данных 0.063.
# Базовую линейку на нём по-прежнему сторожит test_reference_candidate_is_strong.
#
# Проверка на отложенной свежей трети: 0.2% STRONG (на калибровочной 1.0%) —
# дрейф вниз, у ETH и SOL он в другую сторону. Разброс в допуске.
#
# Меняешь пороги — бампай version (правило 6 из docs/step_04_multi_symbol.md)
# и обнови sanity-якорь в tests/fixtures/sanity_candidates.json.

symbol: BTCUSDT
version: 2
description: Калибровка по 9810 свежим кандидатам прогона #17, веса btc
extends: _default
weights: {statistical: 0.3, directional: 0.35, context: 0.2, rarity: 0.15}
statistical:
  sample_size:
    mode: higher_better
    ladder:
    - [2342, 1.0]
    - [904, 0.7]
    - [201, 0.4]
    floor: 0.1
  monthly_concentration:
    mode: lower_better
    ladder:
    - [0.0328, 1.0]
    - [0.0407, 0.7]
    - [0.0634, 0.3]
    floor: 0.0
  repeatability_months:
    mode: higher_better
    ladder:
    - [92, 1.0]
    - [81, 0.7]
    - [50, 0.4]
    floor: 0.1
directional:
  win_rate:
    mode: higher_better
    ladder:
    - [0.6364, 1.0]
    - [0.5957, 0.7]
    - [0.5687, 0.4]
    floor: 0.1
  abs_outcome_skew:
    mode: higher_better
    ladder:
    - [0.2727, 1.0]
    - [0.1915, 0.7]
    - [0.1373, 0.4]
    floor: 0.1
  fa_ratio:
    mode: higher_better
    ladder:
    - [3.365, 1.0]
    - [2.632, 0.7]
    - [2.259, 0.4]
    floor: 0.1
rarity:
  research_score:
    mode: higher_better
    ladder:
    - [0.7766, 1.0]
    - [0.7459, 0.7]
    - [0.7115, 0.4]
    floor: 0.2
rating: {strong_min: 0.713, moderate_min: 0.505}
batch: {min_quality_score: 0.505, fresh_bonus: 0.05}
