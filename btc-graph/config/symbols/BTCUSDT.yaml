# Калибровка BTCUSDT, версия 3. Основа — черновик scripts/calibrate_profile.py
# по 7980 свежим кандидатам новой выгрузки (модель прогона #24, полная история
# 313 439 баров 15m, граница 2026-08-01).
#
# ─── Почему профиль перекалиброван (2026-08-13) ────────────────────────────
# Правки блока A внешнего аудита изменили и выдачу генератора, и вход оси
# rarity (btc-graph/docs/development_log.md, раздел 5; генератор — раздел 29):
#
#   * порог выборки применяется к РЕАЛИЗАЦИЯМ перехода, а не к строкам
#     снимков, — часть кандидатов перестала выпускаться;
#   * `research_score` считает объём выборки по реализациям и просел;
#   * за редкость блока событий баллы больше не начисляются, когда выборка
#     на блок не обусловлена, — а это большинство выдачи.
#
# Второе основание, независимое от аудита: действующая калибровка снята с
# модели состояний, которую в бою уже заменили переобучением 2026-08-11.
# Профиль обязан описывать ту модель, что работает сейчас.
#
# ─── Новое: ступень по реализациям ─────────────────────────────────────────
# `effective_sample_size` — число независимых реализаций перехода. Она НЕ
# заменяет `sample_size`, а стоит рядом: кандидат, выпущенный до 2026-08-13,
# поля не несёт и считается прежней ступенью, на которой и был выпущен.
# Отношение строк к реализациям — 1.5…2.8, и оно не константа: оно зависит от
# того, как долго держалось состояние. Ранжируя по `sample_size`, ось частично
# ранжировала по живучести состояния, а не по объёму свидетельств.
#
# ─── Что получилось ────────────────────────────────────────────────────────
# Действующий профиль @2 на новой выгрузке давал 0.5% STRONG и 20.1% MODERATE
# при медиане 0.4225 — вдвое строже, чем на калибровочных данных @2 (1.0% и
# 37.6%). Не потому, что кандидаты стали хуже: ступени описывали другую
# популяцию. Версия 3 возвращает селективность эталона: 1.0% STRONG,
# 37.8% MODERATE, медиана 0.4467, все четыре оси с живым разбросом
# (σ 0.12…0.25, ни одна не вырождена).
#
# Ступени sample_size опустились (1010/585/242 против 2342/904/201). Верхняя
# упала более чем вдвое, нижняя выросла — распределение стало у́же с обоих
# концов: слева его подрезал новый порог выборки, справа — более дробный граф
# новой модели.
#
# Проверка на отложенной свежей трети: 0.8% STRONG (на калибровочной 1.3%),
# MODERATE 47.0% против 37.4%. Дрейф MODERATE вверх заметный; он структурный
# (sample_size растёт со временем), но если доля STRONG уползёт выше 5% —
# пересобирать профиль, а не терпеть.
#
# Эталонный кандидат из ТЗ по этому профилю по-прежнему MODERATE. Базовую
# линейку на нём сторожит test_reference_candidate_is_strong (по `_default`).
#
# Меняешь пороги — бампай version (правило 6 из docs/step_04_multi_symbol.md)
# и обнови sanity-якорь в tests/fixtures/sanity_candidates.json.

symbol: BTCUSDT
version: 3
description: Калибровка по 7980 свежим кандидатам выгрузки модели #24, веса btc
extends: _default
weights: {statistical: 0.3, directional: 0.35, context: 0.2, rarity: 0.15}
statistical:
  sample_size:
    mode: higher_better
    ladder:
    - [1010, 1.0]
    - [585, 0.7]
    - [242, 0.4]
    floor: 0.1
  effective_sample_size:
    mode: higher_better
    ladder:
    - [416, 1.0]
    - [248, 0.7]
    - [127, 0.4]
    floor: 0.1
  monthly_concentration:
    mode: lower_better
    ladder:
    - [0.0416, 1.0]
    - [0.0498, 0.7]
    - [0.0611, 0.3]
    floor: 0.0
  repeatability_months:
    mode: higher_better
    ladder:
    - [78, 1.0]
    - [70, 0.7]
    - [55, 0.4]
    floor: 0.1
directional:
  win_rate:
    mode: higher_better
    ladder:
    - [0.6316, 1.0]
    - [0.5965, 0.7]
    - [0.5684, 0.4]
    floor: 0.1
  abs_outcome_skew:
    mode: higher_better
    ladder:
    - [0.2632, 1.0]
    - [0.193, 0.7]
    - [0.1368, 0.4]
    floor: 0.1
  fa_ratio:
    mode: higher_better
    ladder:
    - [3.18, 1.0]
    - [2.736, 0.7]
    - [2.117, 0.4]
    floor: 0.1
rarity:
  research_score:
    mode: higher_better
    ladder:
    - [0.7303, 1.0]
    - [0.7055, 0.7]
    - [0.6794, 0.4]
    floor: 0.2
rating: {strong_min: 0.728, moderate_min: 0.482}
batch: {min_quality_score: 0.482, fresh_bonus: 0.05}
